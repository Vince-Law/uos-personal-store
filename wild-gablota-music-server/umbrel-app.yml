releaseNotes: >-
  Version 1.7.0 - Privacy, Presence, Listen-Along

    Privacy:
    - Per-user privacy settings: library visibility (private/server),
      show liked songs / liked albums / most listened / now playing,
      and allow listen-along. Settings → new Privacy card with toggles
    - Default for existing users stays private (no behaviour change
      unless you opt in)
    - GET/PUT /api/me/privacy and GET /api/me

    Social / Presence:
    - New "Server" tab listing every user on the server with their
      role, public profile button, and (if shared) a live now-playing
      card with a pulsing live-dot indicator
    - User profile view shows another user's shared library, liked
      songs / albums, and most listened, all gated by their privacy
    - GET /api/server/users and /api/server/users/:id/profile

    Real-time (WebSocket):
    - New /api/realtime WS channel with JWT auth on connect
    - Presence hub broadcasts now-playing updates to subscribers,
      filtered by each user's showNowPlaying flag
    - Auto-reconnect on disconnect; heartbeat every 45s
    - Web client posts state on track change / play / pause and every
      5s for drift correction

    Listen-Along:
    - Users who opt in via "Allow listen-along" automatically host a
      session when they start playing
    - Other users see a "Join" button on the listener card; on click
      the guest player passively syncs to the host (track, position,
      play/pause) with drift > 1s triggering a re-seek
    - Listen-along banner in the player shows when guest mode is
      active; click to leave

    Published Docker image maksimab/music-server:1.7.0

  Version 1.6.0 - Multi-User Uploads + Personal Libraries

    Major Features:
    - Per-user "My Library" model: each user has a personal collection of
      albums. Existing single-user content is auto-assigned to the admin's
      library on first boot; nothing visible changes for existing setups
    - Web upload UI: drag-drop audio files or whole album folders, server
      scans tags, creates a pending upload entry awaiting admin review
    - Admin review console at /review.html — 3-pane UI (pending queue /
      grouped tree / bulk-edit panel) with per-track and bulk metadata
      editing before approval
    - On approve: cleaned tags are written back to the audio files via
      ffmpeg (stream copy, no re-encode), files are moved into
      library/<Artist>/<Album>/, Song rows are created with normalized
      artist/album dedup, and the album is added to the uploader's library
    - New Browse view in the web player to discover everything on the
      server with one-click "Add to My Library"
    - In-app notification center (bell badge) for upload approved/rejected
      events, polled every 30s

    Backend:
    - New tables: UserLibrary, UserPrivacy, PendingUpload, PendingTrack,
      NotificationItem (plus User.role column)
    - New endpoints under /api/library, /api/browse, /api/uploads,
      /api/notifications
    - Boot migration ensures existing albums populate admin's UserLibrary
      idempotently; safe to redeploy
    - Text normalization service (lowercase + strip articles + collapse
      punctuation) used to dedupe artists/albums on upload

    Published Docker image maksimab/music-server:1.6.0

  Version 1.5.1 - Web Player Hotfix

    Server API:
    - GET /api/liked-songs now returns a flat array of Song objects
      (previously returned { likedSongs: [...] } with nested rows)
    - GET /api/liked-albums filters out orphan likes whose album was
      deleted (was returning HTTP 500 on such rows)
    - GET /api/playback-stats/stats/top-by-minutes now includes song,
      artist, and album data inline so clients can render full track
      info without a second lookup

    Web Player:
    - Defensive response parsing in loadLikedSet / loadLikedAlbumSet
      that accepts both the new flat array shape and the legacy
      wrapped shape from older servers
    - Fixed "Couldn't load songs" on album pages — server returns the
      whole album object, client now unwraps the embedded songs[]
    - Top Tracks rows on the Statistics page are now clickable and
      start playing the selected track with the rest of the top list
      queued
    - Top Album and Top Artist rows on Statistics navigate to the
      detail pages

    Library:
    - Liked Songs / Liked Albums counts on the Library shortcut tiles
      and Most Listened all populate correctly now that the API
      shapes match

    Published Docker image maksimab/music-server:1.5.1

  Version 1.5.0 - Sodium Amber Redesign + Crossfade

    Major Features:
    - Full web player redesign with new Sodium Amber visual system (warm near-black
      surfaces, sodium-amber accent, Fraunces editorial serif headings, Inter UI,
      JetBrains Mono numerics)
    - Crossfade and gapless playback engine in both mobile and web — single slider
      0-12 seconds (0 = gapless instant-swap, >0 = volume crossfade over N seconds)
    - Dual-audio engine handles preload, volume tween, and seamless track transitions
      with proper cancel-on-skip and pause behaviour
    - New "Statistics" view with TOTAL TIME hero and Top Tracks / Albums / Artists
    - New "Liked Albums" full-page grid view
    - New "Settings" page in the web player with crossfade control and sign-out

    Web Player Rewrite:
    - Full rewrite of player.html / player.js (~1300 lines) with sidebar navigation,
      hero-styled view headers, accent active-indicator, and an editorial empty state
      for search
    - Live search across artists, liked albums, and the playback-stats pool with
      220ms debounce and grouped Artists / Albums / Songs results
    - Album hero strip with palette-tinted cover, accent eyebrow, large display
      title, and pill action row (Play all / Add to queue / Like album)
    - Floating now-playing bar with accent play button (with glow), animated
      equalizer indicator on the currently playing row, queue sidebar with EQ bars
    - Optimistic like/unlike with rollback on API failure
    - Admin panel restyled — stat cards moved off the purple gradient to surface
      cards with accent radial glow; log levels now use the new palette

    Mobile App Improvements:
    - All detail screens (Liked Songs, Most Listened, Statistics, Liked Albums) now
      match the redesign with hero icons, accent rank chips, and the floating
      mini-player bar
    - Settings → Sync now runs the full four-step recovery (library + liked songs +
      liked albums + playback stats) so a freshly installed app can rebuild from
      the server in one tap

    Bug Fixes:
    - Fixed broken /playback-stats/* endpoint URLs in the client (were missing the
      /api/ prefix — server stats were silently 404'ing every 5 minutes)
    - Fixed PlaybackStat.fromJson crashing on null lastPlayedAt (server uses
      lastPlayedAt, client expected lastPlayed)
    - Replaced destructive POST sync for liked songs/albums with safe GET-based
      restoreFromServer so a fresh local cache no longer wipes server-side likes
    - Fixed pre-existing compile error in download_service.dart (File.length()
      called on a bool)

    Infrastructure:
