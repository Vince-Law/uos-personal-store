manifestVersion: 1
id: wild-gablota-nanobot
category: productivity
name: NanoBot
icon: https://raw.githubusercontent.com/HKUDS/NanoBot/main/assets/logo/logo.png
version: "0.1.4.post2-18"

tagline: Multi-agent AI chatbot gateway for Telegram and more
description: >-
  NanoBot is a self-hosted AI chatbot framework and HTTP gateway for chat channels
  such as Telegram. This Umbrel package runs NanoBot in a container with persistent
  configuration stored in Umbrel app data.


  It is configured to work well behind Umbrel's app proxy so you can expose it to the
  public internet through your existing Cloudflare Tunnel on Raspberry Pi.


  First start creates a default NanoBot config file and helper files in app data.
  Update the config with your model provider API key and Telegram bot token, then
  restart the app.

developer: HKUDS
website: https://github.com/HKUDS/NanoBot
dependencies: []
repo: https://github.com/HKUDS/NanoBot
support: https://github.com/HKUDS/NanoBot
port: 1210
gallery: []
path: /health
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Make NanoBot service install-health healthy by design; let bridge own real readiness.

    - NanoBot now runs in a separate `nanobot` service (`wild-gablota-nanobot_nanobot_1`)
    - `app_1` is a `netshoot` bridge container (includes `curl`) that forwards `18791 -> 127.0.0.1:18790`
    - Umbrel's legacy `curl` healthcheck now runs against the bridge container, not the NanoBot image
    - `app_proxy` continues to target `app:18791`
    - NanoBot service healthcheck is now a no-op (prevents install failure on transient/strict `/health` semantics)
    - Bridge starts after NanoBot container is started, then waits/retries until NanoBot is actually reachable
    - Keeps writable PATH-based `curl` shim fallback in NanoBot service for extra compatibility
    - Starts loopback bridge only after NanoBot healthcheck passes
    - Keeps socat bridge running in a restart loop to survive early/refused probe connections
    - `app_proxy` continues to connect to bridge port `18791`
    - Keeps explicit `gateway.host` / `gateway.port` config bootstrap and migration logic
    - Keeps valid `providers`-based config bootstrap and migration logic
    - Keeps config persisted under Umbrel app data
    - Cloudflare Tunnel-friendly proxy setup (no auth injection)

torOnly: false
