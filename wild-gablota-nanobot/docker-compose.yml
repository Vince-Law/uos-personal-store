version: '3.8'
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 18791
      PROXY_AUTH_ADD: 'false'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    container_name: wild-gablota-nanobot_app_proxy_1

  app:
    image: jerryin/nanobot:latest
    restart: on-failure
    stop_grace_period: 1m
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${APP_DATA_DIR}/data/nanobot:/root/.nanobot
    entrypoint:
      - python
      - -c
      - >-
        import json, os;
        d="/root/.nanobot"; c=f"{d}/config.json"; p=f"{d}/prompts.md"; m=f"{d}/mcp_servers.json";
        os.makedirs(d, exist_ok=True);
        tmpl={"providers":{"openai":{"apiKey":"CHANGE_ME_OPENAI_API_KEY"}},"agents":{"defaults":{"model":"openai/gpt-4o-mini","workspace":"~/.nanobot/workspace"}},"gateway":{"host":"0.0.0.0","port":18790},"channels":{"telegram":{"enabled":False,"token":"CHANGE_ME_TELEGRAM_BOT_TOKEN","allowFrom":["123456789"]}}};
        (not os.path.exists(c)) and open(c,"w",encoding="utf-8").write(json.dumps(tmpl,indent=2));
        os.path.exists(c) and (lambda t:(("\"providers\"" not in t) and (("\"llm_services\"" in t) or ("\"gateway_api_keys\"" in t))) and open(c,"w",encoding="utf-8").write(json.dumps(tmpl,indent=2)))(open(c,"r",encoding="utf-8").read());
        os.path.exists(c) and (lambda j: (j.setdefault("gateway", {"host":"0.0.0.0","port":18790}) is not None) and open(c,"w",encoding="utf-8").write(json.dumps(j,indent=2)))(json.load(open(c,"r",encoding="utf-8"))) if os.path.exists(c) else None;
        (not os.path.exists(p)) and open(p,"w",encoding="utf-8").write("# NanoBot prompts\n");
        (not os.path.exists(m)) and open(m,"w",encoding="utf-8").write("{}\n");
        os.execvp("nanobot",["nanobot","gateway"])
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:18790/health", timeout=5).getcode()==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    container_name: wild-gablota-nanobot_app_1

  loopback_bridge:
    image: alpine/socat:1.8.0.3
    restart: on-failure
    network_mode: service:app
    depends_on:
      - app
    command:
      - TCP-LISTEN:18791,fork,bind=0.0.0.0,reuseaddr
      - TCP:127.0.0.1:18790
